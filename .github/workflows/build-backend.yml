name: Build Backend

on:
  push:
    branches: [main, master, develop]
    paths:
      - "server/**"
      - ".github/workflows/build-backend.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "server/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build .NET 9
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Valgor.sln

      - name: Build
        run: dotnet build Valgor.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish Valgor.Api/Valgor.Api.csproj --configuration Release --no-build --output ./artifacts/api
